<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遠鉄時刻</title>
<meta name="theme-color" content="#c2361f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="遠鉄時刻">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: one narrow column — direction switch, station pickers, then the train list like a platform board */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1b1f1d; --muted:#626b67; --line:#dde1de;
  --accent:#c2361f; --accent-soft:#f8e5e1; --next:#1e5e8c; --next-soft:#e3eef6;
  --font-body:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-num:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --surface:#1d2120; --fg:#e9ecea; --muted:#9aa39f; --line:#323836;
  --accent:#ef6a52; --accent-soft:#3a201b; --next:#7fb6e0; --next-soft:#18293a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1d2120; --fg:#e9ecea; --muted:#9aa39f; --line:#323836;
  --accent:#ef6a52; --accent-soft:#3a201b; --next:#7fb6e0; --next-soft:#18293a; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px}
h1{font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.82rem;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.92rem;padding:10px 6px;border:0;background:transparent;color:var(--fg);cursor:pointer;line-height:1.3}
.seg button small{display:block;font-size:.72rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700}
.seg button[aria-pressed="true"] small{color:#fff;opacity:.85}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg4 button+button,.seg button+button{border-left:1px solid var(--line)}
.cars{display:inline-block;font-size:.78rem;border-radius:4px;padding:0 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.cars.four{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.stations{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
select{font:inherit;font-size:1rem;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}
.swap{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;width:40px;height:42px;cursor:pointer;font-size:1.1rem}
button:focus-visible,select:focus-visible{outline:2px solid var(--next);outline-offset:2px}
.msg{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg button{font:inherit;font-size:.85rem;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.summary h2{font-size:1rem;margin:0}
.summary span{color:var(--muted);font-size:.8rem}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:.06em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.t{font-family:var(--font-num);font-size:1.12rem;font-weight:600}
.arrow{color:var(--muted);width:1.2em;padding:0}
.dur{color:var(--muted);font-size:.85rem;text-align:right}
.mk{font-size:.7rem;white-space:nowrap}
.chip{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
tr.past td{opacity:.42}
tr.next td{background:var(--next-soft)}
tr.next .t{color:var(--next)}
.nextchip{background:var(--next);color:var(--bg);border-color:var(--next)}
.scroll{max-height:62vh;overflow-y:auto}
.foot{color:var(--muted);font-size:.78rem;display:flex;flex-direction:column;gap:2px}
@media (max-width:380px){.t{font-size:1rem}td,th{padding-left:8px;padding-right:8px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>遠州鉄道線 時刻検索</h1>
    <p class="sub">2025年3月3日改正・発車時刻は全曜日共通</p>
  </header>
  <section class="panel">
    <div class="field">
      <span class="label">方面</span>
      <div class="seg" role="group" aria-label="方面">
        <button id="dir-up" type="button" aria-pressed="true">上り<small>新浜松方面行</small></button>
        <button id="dir-down" type="button" aria-pressed="false">下り<small>西鹿島方面行</small></button>
      </div>
    </div>
    <div class="field">
      <span class="label">曜日（編成両数が変わります）</span>
      <div class="seg seg4" role="group" aria-label="曜日">
        <button id="day-mt" type="button" data-day="mt" aria-pressed="false">月〜木</button>
        <button id="day-fri" type="button" data-day="fri" aria-pressed="false">金</button>
        <button id="day-sat" type="button" data-day="sat" aria-pressed="false">土</button>
        <button id="day-hol" type="button" data-day="hol" aria-pressed="false">日・祝</button>
      </div>
    </div>
    <div class="stations">
      <label class="field"><span class="label">出発駅</span><select id="from"></select></label>
      <button class="swap" id="swap" type="button" aria-label="出発駅と到着駅を入れ替える" title="入れ替え">⇄</button>
      <label class="field"><span class="label">到着駅</span><select id="to"></select></label>
    </div>
    <div class="msg" id="msg" hidden></div>
  </section>
  <section id="result" style="display:flex;flex-direction:column;gap:10px">
    <div class="summary"><h2 id="title"></h2><span id="count"></span></div>
    <div class="board"><div class="scroll" id="scroll">
      <table><thead><tr><th>発車</th><th class="arrow"></th><th>到着</th><th style="text-align:right">所要</th><th>編成</th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div></div>
  </section>
  <div class="foot">
    <span>時刻表の注記による編成：※の列車は平日（月〜金）4両、▲の列車は金・土のみ4両。それ以外は2両として表示しています。</span>
    <span>曜日は今日（日本時間）に合わせて選ばれます。祝日は自動判定しないので、祝日は「日・祝」を選んでください。</span>
    <span>今日の曜日を表示中は、発車済みの列車を薄く、次の列車を青で表示します。</span>
  </div>
</div>

  $("dir-down").setAttribute("aria-pressed",state.dir==="down");
  for(const b of document.querySelectorAll("[data-day]"))b.setAttribute("aria-pressed",b.dataset.day===day);
  try{localStorage.setItem("entetsu-search",JSON.stringify(state))}catch(e){}
  const order=ORDER[state.dir],fi=order.indexOf(state.from),ti=order.indexOf(state.to);
  const msg=$("msg"),res=$("result");
  if(fi===ti){msg.hidden=false;msg.innerHTML="出発駅と到着駅が同じです。別の駅を選んでください。";res.hidden=true;return}
  if(fi>ti){
    const other=state.dir==="up"?"下り（西鹿島方面行）":"上り（新浜松方面行）";
    msg.hidden=false;msg.innerHTML=`${state.from} → ${state.to} は${other}です。`;
    const b=document.createElement("button");b.type="button";b.textContent=other.slice(0,2)+"に切り替える";
    b.onclick=()=>{state.dir=state.dir==="up"?"down":"up";fillSelects();render()};
    msg.appendChild(b);res.hidden=true;return;
  }
  msg.hidden=true;res.hidden=false;
  const isToday=day===todayDay();
  $("title").textContent=`${state.from} → ${state.to}（${DAY_NAMES[day]}）`;
  const list=TRAINS[state.dir],now=isToday?nowMin():-1;
  let nextIdx=-1,html="",four=0;
  list.forEach((tr,i)=>{
    const d=tr.times[fi],a=tr.times[ti],past=mins(d)<now;
    if(!past&&nextIdx<0)nextIdx=i;
    const c=carsOf(tr.mk,day);if(c===4)four++;
    const chips=[`<span class="cars${c===4?" four":""}">${c}両</span>`];
    if(i===nextIdx)chips.push('<span class="chip nextchip">次</span>');
    html+=`<tr class="${i===nextIdx?"next":past?"past":""}" ${i===nextIdx?'id="nextrow"':""}><td class="t">${d}</td><td class="arrow">→</td><td class="t">${a}</td><td class="dur">${mins(a)-mins(d)}分</td><td class="mk">${chips.join(" ")}</td></tr>`;
  });
  $("rows").innerHTML=html;
  const base=`全${list.length}本（4両 ${four}本）`;
  $("count").textContent=!isToday?base:nextIdx<0?`${base}・本日の運転は終了しました`:`${base}・残り${list.length-nextIdx}本`;
  const nr=$("nextrow"),sc=$("scroll");
  if(nr)sc.scrollTop=Math.max(0,nr.offsetTop-sc.querySelector("th").offsetHeight-4);else sc.scrollTop=0;
}
$("dir-up").onclick=()=>{if(state.dir!=="up"){state.dir="up";[state.from,state.to]=[state.to,state.from];fillSelects();render()}};
$("dir-down").onclick=()=>{if(state.dir!=="down"){state.dir="down";[state.from,state.to]=[state.to,state.from];fillSelects();render()}};
$("from").onchange=e=>{state.from=e.target.value;render()};
$("to").onchange=e=>{state.to=e.target.value;render()};
$("swap").onclick=()=>{[state.from,state.to]=[state.to,state.from];state.dir=state.dir==="up"?"down":"up";fillSelects();render()};
for(const b of document.querySelectorAll("[data-day]"))b.onclick=()=>{day=b.dataset.day;render()};
fillSelects();render();
setInterval(render,60000);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
